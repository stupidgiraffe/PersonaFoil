name: PersonaFoil Productization Helper

on:
  push:
    branches:
      - automation/personafoil-productization

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@v4
        with:
          path: automation

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/persona-identity
          path: target
          submodules: recursive
          fetch-depth: 0

      - name: Apply integration edits
        shell: bash
        run: |
          set -euo pipefail
          cp automation/tools/integrate_existing.py target/.integrate_existing.py
          cd target
          python3 .integrate_existing.py
          rm .integrate_existing.py

      - name: Validate portable tests and diff
        shell: bash
        run: |
          set -euo pipefail
          cd target
          make host-test
          git diff --check
          ruby -e 'require "yaml"; Dir[".github/**/*.yml"].each { |f| YAML.load_file(f) }; puts "YAML validation: PASS"'
          ! grep -R --line-number --fixed-strings 'assets[0]' source include
          ! grep -R --line-number --fixed-strings 'zipball_url' source include
          ! grep -R --line-number --fixed-strings 'temp_download.zip' source include

      - name: Commit and push target branch
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No target changes to commit.'
            exit 0
          fi
          git commit -m 'feat: integrate verified updates and release polish'
          git push origin HEAD:feature/persona-identity
