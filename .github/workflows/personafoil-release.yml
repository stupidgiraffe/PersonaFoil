name: PersonaFoil Release

on:
  push:
    tags:
      - "v*"
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.1.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: publish ')
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve release tag
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            version="$(awk -F':=' '/^APP_VERSION[[:space:]]*:/{gsub(/[[:space:]]/, "", $2); print $2}' Makefile)"
            test -n "$version"
            tag="v$version"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install Switch port libraries
        run: dkp-pacman -S --noconfirm --needed switch-ntfs-3g switch-lwext4

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          make -j"$(nproc)" RELEASE=1
          test -s personafoil.nro
          mkdir -p dist/switch/PersonaFoil
          cp personafoil.nro dist/switch/PersonaFoil/personafoil.nro
          python3 - <<'PY'
          import os
          import zipfile

          with zipfile.ZipFile("personafoil.zip", "w", zipfile.ZIP_DEFLATED) as archive:
              for root, _, files in os.walk("dist"):
                  for name in files:
                      path = os.path.join(root, name)
                      archive.write(path, os.path.relpath(path, "dist"))
          PY
          sha256sum personafoil.nro personafoil.zip > SHA256SUMS.txt
          grep -Eq "^[0-9a-f]{64}  personafoil\.nro$" SHA256SUMS.txt
          grep -Eq "^[0-9a-f]{64}  personafoil\.zip$" SHA256SUMS.txt

      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            personafoil.nro
            personafoil.zip
            SHA256SUMS.txt
          generate_release_notes: true
